services:
  cache.vale:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [vale]
  logger.channel.vale:
    parent: logger.channel_base
    arguments: ['vale']
  # What the site has installed: the binary, its version, the configuration
  # and the rules it loads. The runner and the status report both read it.
  vale.environment:
    class: Drupal\vale\ValeEnvironment
    arguments:
      - '@cache.vale'
      - '@config.factory'
      - '@datetime.time'
  Drupal\vale\ValeEnvironment: '@vale.environment'
  vale.runner:
    class: Drupal\vale\ValeRunner
    arguments:
      - '@vale.environment'
      - '@cache.vale'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.vale'
  Drupal\vale\ValeRunnerInterface: '@vale.runner'
  # Hook classes. Drupal 11.1 and later register these by themselves.
  # Drupal 10 does not, and its procedural hooks in vale.module and
  # vale.install fetch them from here.
  Drupal\vale\Hook\ValeRequirements:
    autowire: true
  Drupal\vale\Hook\ValeFieldUiHooks:
    autowire: true
  vale.field_linter:
    class: Drupal\vale\FieldLinter
    arguments:
      - '@vale.runner'
  Drupal\vale\FieldLinter: '@vale.field_linter'
  # Findings that did not stop a save, kept for the rest of the request.
  vale.alert_collector:
    class: Drupal\vale\AlertCollector
    arguments:
      - '@entity_type.bundle.info'
  Drupal\vale\AlertCollector: '@vale.alert_collector'
  vale.publish_state:
    class: Drupal\vale\PublishState
    arguments:
      - '@?content_moderation.moderation_information'
  Drupal\vale\PublishState: '@vale.publish_state'
  vale.jsonapi_alerts_subscriber:
    class: Drupal\vale\EventSubscriber\JsonApiAlertsSubscriber
    arguments:
      - '@vale.alert_collector'
    tags:
      - { name: event_subscriber }
  Drupal\vale\Hook\ValeEntityHooks:
    autowire: true
  Drupal\vale\Hook\ValeFormHooks:
    autowire: true
  vale.content_walker:
    class: Drupal\vale\ContentWalker
    arguments:
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@entity_field.manager'
      - '@vale.field_linter'
      - '@vale.publish_state'
      - '@?workspaces.manager'
      # The workspace tracker is set by ValeServiceProvider.
      - null
      - '@entity.memory_cache'
  Drupal\vale\ContentWalker: '@vale.content_walker'
  vale.installer:
    class: Drupal\vale\ValeInstaller
    arguments:
      - '@http_client'
      - '@file_system'
  Drupal\vale\ValeInstaller: '@vale.installer'
  vale.workspace_publish_subscriber:
    class: Drupal\vale\EventSubscriber\WorkspacePublishSubscriber
    arguments:
      - '@vale.content_walker'
      - '@vale.environment'
      - '@config.factory'
      - '@messenger'
      - '@logger.channel.vale'
    tags:
      - { name: event_subscriber }
  vale.finding_storage:
    class: Drupal\vale\FindingStorage
    arguments:
      - '@database'
      - '@datetime.time'
  Drupal\vale\FindingStorage: '@vale.finding_storage'
  Drupal\vale\Hook\ValeReportHooks:
    arguments:
      - '@vale.content_walker'
      - '@vale.finding_storage'
      - '@vale.publish_state'
      - '@?workspaces.manager'

# Lints a value in the browser with Vale's WebAssembly build. Editor plugins
# attach it with ValeBrowser::attachments(). js/vale-worker.js and
# js/vale-engine.js run in the worker, which loads them itself.
browser:
  js:
    js/vale-common.js: {}
    js/vale-browser.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings

# Finds where an alert is in a value, and keeps it there while it changes.
text:
  js:
    js/vale-text.js: {}

# Lists the findings under a text area or text field while the author types.
# ValeWidgetHooks attaches it to each widget that shows findings.
findings:
  js:
    js/vale-findings.js: {}
  css:
    component:
      css/vale-findings.css: {}
  dependencies:
    - core/drupal
    - core/drupal.announce
    - core/drupal.debounce
    - core/drupalSettings
    - core/once
    - vale/browser
    - vale/text

# The CKEditor 5 plugin that marks findings in the text.
ckeditor5.findings:
  js:
    js/vale-card.js: {}
    js/ckeditor5_plugins/valeFindings.js: {}
  css:
    component:
      css/vale-findings.css: {}
  dependencies:
    - core/ckeditor5
    - core/drupal
    - core/drupal.debounce
    - vale/browser
    - vale/text

# The toolbar button's icon in the text format's settings.
ckeditor5.admin:
  css:
    theme:
      css/vale-ckeditor5.admin.css: {}

vale.settings:
  type: config_object
  label: 'Vale settings'
  constraints:
    FullyValidatable: ~
  mapping:
    formats:
      type: sequence
      label: 'File extension for each text format'
      sequence:
        type: string
        label: 'Extension'
        constraints:
          Regex:
            pattern: '/^[A-Za-z0-9]+$/'
            message: 'An extension holds only letters and digits.'
    default_extension:
      type: string
      label: 'File extension for text formats that are not listed'
      constraints:
        Regex:
          pattern: '/^[A-Za-z0-9]+$/'
          message: 'An extension holds only letters and digits.'
    timeout:
      type: integer
      label: 'Time limit for one Vale run, in seconds'
      constraints:
        Range:
          min: 1
          max: 300
    publish_only:
      type: boolean
      label: 'Refuse error-level findings only when content is published'
    fail_closed:
      type: boolean
      label: 'Refuse a save when Vale cannot check its text'
    workspace_mode:
      type: string
      label: 'Workspace publish check: block, advise or off'
      constraints:
        Choice:
          - block
          - advise
          - 'off'
    check_limit:
      type: integer
      label: 'Requests to the check endpoint each user may make in one window'
      constraints:
        Range:
          min: 1
    check_window:
      type: integer
      label: 'Length of the check endpoint window, in seconds'
      constraints:
        Range:
          min: 1

field.field.*.*.*.third_party.vale:
  type: mapping
  label: 'Vale prose checks'
  mapping:
    enabled:
      type: boolean
      label: 'Check the prose in this field'
    min_level:
      type: string
      label: 'Lowest level to report'
      constraints:
        Choice:
          - error
          - warning
          - suggestion
    disabled_rules:
      type: sequence
      label: 'Rules turned off'
      sequence:
        type: string
        label: 'Rule'
    level_overrides:
      type: sequence
      label: 'Level changes'
      sequence:
        type: mapping
        label: 'Level change'
        mapping:
          rule:
            type: string
            label: 'Rule'
          level:
            type: string
            label: 'New level'
            constraints:
              Choice:
                - error
                - warning
                - suggestion
    profile:
      type: string
      label: 'Name the values are linted under'
      constraints:
        Regex:
          pattern: '/^[A-Za-z0-9_.-]*$/'
          message: 'Use only letters, digits, dots, hyphens and underscores.'

action.configuration.vale_check_prose:
  type: action_configuration_default
  label: 'Check prose with Vale'

name: 'Vale dev content'
description: 'Provides a Page content type whose body is checked with Vale, so a fresh development site has a field to test Vale against.'
type: 'Content type'
install:
  - node
  - text
  - vale
config:
  actions:
    node.type.page:
      createIfNotExists:
        status: true
        langcode: en
        name: Page
        description: 'A page whose body prose is checked with Vale on every validating save.'
        new_revision: true
        preview_mode: 1
        display_submitted: false
    field.storage.node.body:
      createIfNotExists:
        status: true
        langcode: en
        field_name: body
        entity_type: node
        type: text_with_summary
        settings: {  }
        locked: false
        cardinality: 1
        translatable: true
        indexes: {  }
        persist_with_no_fields: true
        custom_storage: false
    field.field.node.page.body:
      createIfNotExists:
        status: true
        langcode: en
        field_name: body
        entity_type: node
        bundle: page
        label: Body
        description: ''
        required: false
        translatable: true
        default_value: {  }
        default_value_callback: ''
        # Empty settings: the field type's defaults apply at runtime, which
        # keeps this valid on cores whose text_with_summary settings schema
        # differs.
        settings: {  }
        field_type: text_with_summary
        third_party_settings:
          vale:
            enabled: true
            min_level: suggestion
            disabled_rules: {  }
            level_overrides: {  }
            profile: ''
    core.entity_form_display.node.page.default:
      createIfNotExists:
        targetEntityType: node
        bundle: page
        mode: default
        status: true
      setComponents:
        - name: title
          options:
            type: string_textfield
            weight: 0
            region: content
        - name: body
          options:
            type: text_textarea_with_summary
            weight: 1
            region: content
        - name: status
          options:
            type: boolean_checkbox
            weight: 120
            region: content
    core.entity_view_display.node.page.default:
      createIfNotExists:
        targetEntityType: node
        bundle: page
        mode: default
        status: true
      setComponents:
        - name: body
          options:
            type: text_default
            label: hidden
            weight: 0
            region: content
        - name: links
          options:
            weight: 100
            region: content

name: 'Vale dev content'
description: 'Provides a Page content type whose body is checked with Vale, so a fresh development site has content to lint.'
type: 'Content type'
install:
  - node
  - text
  - vale
config:
  strict:
    # Treat field storages strictly, since they influence the database layout.
    - field.storage.node.body
  actions:
    core.entity_form_display.node.page.default:
      createIfNotExists:
        targetEntityType: node
        bundle: page
        mode: default
        status: true
      setComponents:
        - name: title
          options:
            type: string_textfield
            weight: 0
            region: content
        - name: body
          options:
            type: text_textarea_with_summary
            weight: 1
            region: content
        - name: status
          options:
            type: boolean_checkbox
            weight: 120
            region: content
    core.entity_view_display.node.page.default:
      createIfNotExists:
        targetEntityType: node
        bundle: page
        mode: default
        status: true
      setComponents:
        - name: body
          options:
            type: text_default
            label: hidden
            weight: 0
            region: content
        - name: links
          options:
            weight: 100
            region: content

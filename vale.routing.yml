vale.check:
  path: '/vale/check'
  defaults:
    _controller: '\Drupal\vale\Controller\CheckController::check'
  methods: [POST]
  requirements:
    _permission: 'use vale check'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

# The configuration the browser build reads. Each needs the check endpoint's
# permission, as both check text with the site's styles.
vale.browser_config:
  path: '/vale/config/{langcode}'
  defaults:
    _controller: '\Drupal\vale\Controller\BrowserConfigController::config'
  methods: [GET]
  requirements:
    _permission: 'use vale check'

vale.browser_styles:
  path: '/vale/styles'
  defaults:
    _controller: '\Drupal\vale\Controller\BrowserConfigController::styles'
  methods: [GET]
  requirements:
    _permission: 'use vale check'

vale.browser_models:
  path: '/vale/models/{langcode}'
  defaults:
    _controller: '\Drupal\vale\Controller\BrowserConfigController::models'
  methods: [GET]
  requirements:
    _permission: 'use vale check'

vale.report_scan:
  path: '/admin/reports/vale/scan'
  defaults:
    _form: '\Drupal\vale\Form\ScanForm'
    _title: 'Check content'
  requirements:
    _permission: 'scan content with vale'
  options:
    _admin_route: TRUE

vale.report_export:
  path: '/admin/reports/vale/export'
  defaults:
    _controller: '\Drupal\vale\Controller\ReportExportController::export'
  requirements:
    _permission: 'view vale report'
  options:
    _admin_route: TRUE
    no_cache: TRUE

vale.canvas_settings:
  path: '/admin/config/content/vale/canvas'
  defaults:
    _form: '\Drupal\vale\Form\CanvasSettingsForm'
    _title: 'Canvas page prose checks'
  requirements:
    _permission: 'administer components'
    _module_dependencies: 'canvas'
  options:
    _admin_route: TRUE

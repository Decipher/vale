################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# For information on alternative values for 'ref' see https://project.pages.drupalcode.org/gitlab_templates/info/templates-version/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'
################
# Pipeline configuration variables are defined with default values and descriptions in the file
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
################
variables:
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  # Drupal 12 is core's main branch. From core 11.5, run-tests.sh fails a test
  # on any deprecation, so these jobs show new deprecations before stable core
  # reaches 11.5.
  OPT_IN_TEST_NEXT_MAJOR: 1
  _AUTORUN_NEXT_MAJOR: 'push-and-mr'
  # The tests use Paragraphs, which does not declare Drupal 12 support yet.
  # vale does not need it at runtime, so the next major jobs install it anyway.
  _LENIENT_ALLOW_LIST: 'paragraphs,entity_reference_revisions'
  # The phpunit binary (_PHPUNIT_CONCURRENT: 0) loads phpunit.xml from the
  # project root. That file is the scaffold config for local and GitHub runs.
  # This flag points the binary at the DrupalCI config instead.
  _PHPUNIT_EXTRA: '--no-coverage --configuration=phpunit.gitlab-ci.xml'
  # run-tests.sh (_PHPUNIT_CONCURRENT: 1, Drupal.org's default since
  # gitlab_templates 1.17.0) uses core's phpunit config and needs no extra
  # options. The '-' stops the template copying _PHPUNIT_EXTRA into this
  # variable, which run-tests.sh rejects.
  _RUNTESTS_EXTRA: '-'
  # Use run-tests.sh everywhere, as Drupal.org does, so that other GitLab
  # instances fail where Drupal.org fails.
  _PHPUNIT_CONCURRENT: 1

# Coding standards and static analysis gate a merge, rather than warn.
cspell:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false

# RealValeTest runs only where VALE_BINARY points at Vale, so the phpunit jobs
# install a pinned release first, verified by its published checksum.
.install-vale: &install-vale
  - |
    VALE_VERSION=3.18.0
    VALE_SHA256=a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d
    curl -fsSL --retry 3 -o /tmp/vale.tar.gz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
    echo "${VALE_SHA256}  /tmp/vale.tar.gz" | sha256sum -c -
    mkdir -p "$CI_PROJECT_DIR/.vale-bin"
    tar -xzf /tmp/vale.tar.gz -C "$CI_PROJECT_DIR/.vale-bin" vale
    chmod 755 "$CI_PROJECT_DIR/.vale-bin/vale"
    "$CI_PROJECT_DIR/.vale-bin/vale" --version

# Core reads one deprecation ignore file, so the phpunit jobs join core's file
# and the project's .deprecation-ignore.txt into one.
# Core 11.4 and older read the file from SYMFONY_DEPRECATIONS_HELPER. Core 11.5
# and later read it from DRUPAL_DEPRECATION_FILTER_CONFIG, and deprecate
# SYMFONY_DEPRECATIONS_HELPER whenever it is set, so there it is unset. A job
# variable cannot unset it.
.deprecation-ignores: &deprecation-ignores
  - |
    IGNORES="$CI_PROJECT_DIR/.deprecation-ignore.ci.txt"
    cat "$CI_PROJECT_DIR/$_WEB_ROOT/core/.deprecation-ignore.txt" "$CI_PROJECT_DIR/.deprecation-ignore.txt" > "$IGNORES"
    if grep -q DRUPAL_DEPRECATION_FILTER_CONFIG "$CI_PROJECT_DIR/$_WEB_ROOT/core/tests/Drupal/TestTools/Extension/DeprecationBridge/DeprecationHandler.php"; then
      unset SYMFONY_DEPRECATIONS_HELPER
    else
      export SYMFONY_DEPRECATIONS_HELPER="ignoreFile=$IGNORES"
    fi

phpunit:
  before_script:
    - *install-vale
    - *deprecation-ignores
  # Every phpunit variant extends this job. One resource group makes them run
  # one at a time, so two variants never share a database server.
  resource_group: vale-phpunit
  variables:
    VALE_BINARY: $CI_PROJECT_DIR/.vale-bin/vale
    DRUPAL_DEPRECATION_FILTER_CONFIG: '{"enableProjectIgnores":true,"projectIgnoreFile":"$CI_PROJECT_DIR/.deprecation-ignore.ci.txt"}'
